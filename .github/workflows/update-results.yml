name: Update World Cup results

# Pulls results from the free, open openfootball/worldcup.json dataset (no API
# key needed). That source refreshes roughly once a day, so there's no point
# polling every few minutes — we check a handful of times a day to catch the
# update whenever it lands. The script itself stays asleep until the 11 June
# kickoff (WC_KICKOFF guard). You can also trigger it any time with the
# "Run workflow" button.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6,9,12,15,18,21 * * *"   # six times a day (UTC)

# Allow the action to commit the updated results file back to the repo.
permissions:
  contents: write

# Never run two updates at once.
concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit tests (transform logic)
        run: |
          node scripts/test/transform.test.mjs
          node scripts/test/openfootball.test.mjs
          node scripts/test/thesportsdb.test.mjs

      - name: Fetch latest results
        run: node scripts/update-results.mjs

      - name: Commit updated results (if changed)
        run: |
          if git diff --quiet -- data/results.json; then
            echo "No changes to results.json — nothing to commit."
            exit 0
          fi
          git config user.name  "wc-leaderboard-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          git commit -m "Auto-update World Cup results"
          git push
