name: Update World Cup results

# Runs every 15 minutes during match-window hours (16:00-08:59 UTC), which
# covers all 2026 kickoffs (North American afternoon/evening, running late into
# UTC night). ~68 runs/day — comfortably under the free API-Football limit of
# 100/day. Outside those hours it doesn't run; and even when it runs, the script
# itself stays asleep until the 11 June kickoff (see WC_KICKOFF guard).
# You can also trigger it any time with the "Run workflow" button.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 16-23 * * *"   # every 15 min, 16:00-23:59 UTC
    - cron: "*/15 0-8 * * *"     # every 15 min, 00:00-08:59 UTC (overnight matches)

# Allow the action to commit the updated results file back to the repo.
permissions:
  contents: write

# Never run two updates at once.
concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit tests (transform logic)
        run: node scripts/test/transform.test.mjs

      - name: Fetch latest results
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/update-results.mjs

      - name: Commit updated results (if changed)
        run: |
          if git diff --quiet -- data/results.json; then
            echo "No changes to results.json — nothing to commit."
            exit 0
          fi
          git config user.name  "wc-leaderboard-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          git commit -m "Auto-update World Cup results [skip ci]"
          git push
