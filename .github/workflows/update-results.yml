name: Update World Cup results

# MANUAL ONLY for now. This workflow will NOT run on its own.
# It only runs when you click "Run workflow" on the GitHub Actions tab.
#
# When you're ready for hands-off auto-updates during the tournament,
# uncomment the "schedule" block below. It runs every 30 minutes but ONLY
# during match-window hours (16:00-08:59 UTC), which covers all 2026 kickoffs
# (North American afternoon/evening). ~32 runs/day — well under the free
# API-Football limit of 100/day. Outside those hours it stays asleep.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "*/30 16-23 * * *"   # every 30 min, 16:00-23:59 UTC
  #   - cron: "*/30 0-8 * * *"     # every 30 min, 00:00-08:59 UTC (overnight matches)

# Allow the action to commit the updated results file back to the repo.
permissions:
  contents: write

# Never run two updates at once.
concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit tests (transform logic)
        run: node scripts/test/transform.test.mjs

      - name: Fetch latest results
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/update-results.mjs

      - name: Commit updated results (if changed)
        run: |
          if git diff --quiet -- data/results.json; then
            echo "No changes to results.json — nothing to commit."
            exit 0
          fi
          git config user.name  "wc-leaderboard-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          git commit -m "Auto-update World Cup results [skip ci]"
          git push
